<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal AI OS Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .neon-glow {
      box-shadow: 0 0 8px rgba(160, 200, 255, 0.3), 0 0 16px rgba(191, 128, 255, 0.3);
    }
    .taskbar-glow {
      box-shadow: 0 -5px 25px -5px rgba(79, 70, 229, 0.3);
    }
    .text-glow {
      text-shadow: 0 0 8px rgba(190, 220, 255, 0.4);
    }
    .logo-glow {
        filter: drop-shadow(0 0 1.5rem rgba(191, 128, 255, 0.6));
    }
    .border-marquee {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1000;
        opacity: 0;
        animation: marquee-flash 1.5s ease-out forwards;
    }
    .border-marquee::before, .border-marquee::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid;
        border-image-slice: 1;
        border-image-source: linear-gradient(to right, #4f46e5, #a855f7, #ec4899);
        animation: marquee-path 1.5s ease-out forwards;
    }
    @keyframes marquee-flash {
        0% { opacity: 0; }
        10%, 90% { opacity: 1; }
        100% { opacity: 0; }
    }
    @keyframes marquee-path {
        0% { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); }
        25% { clip-path: polygon(0 0, 100% 0, 100% 0, 0 0); }
        50% { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        75% { clip-path: polygon(100% 100%, 100% 0, 0 0, 100% 100%); }
        100% { clip-path: polygon(100% 100%, 100% 100%, 100% 100%, 100% 100%); }
    }
    
    @keyframes slide-in-from-right {
        from { opacity: 0; transform: translateX(50px) scale(0.98); }
        to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slide-out-to-left {
        from { opacity: 1; transform: translateX(0) scale(1); }
        to { opacity: 0; transform: translateX(-50px) scale(0.98); }
    }
    @keyframes slide-in-from-left {
        from { opacity: 0; transform: translateX(-50px) scale(0.98); }
        to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slide-out-to-right {
        from { opacity: 1; transform: translateX(0) scale(1); }
        to { opacity: 0; transform: translateX(50px) scale(0.98); }
    }
    @keyframes fade-in-scale {
        from { opacity: 0; transform: scale(0.9) translateY(20px); filter: blur(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
    }
    @keyframes fade-out-scale {
        from { opacity: 1; transform: scale(1); filter: blur(0); }
        to { opacity: 0; transform: scale(0.95); filter: blur(10px); }
    }

    .animate-fade-in {
        animation: fade-in-scale 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-fade-out {
        animation: fade-out-scale 0.5s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }
    .animate-in-right {
        animation: slide-in-from-right 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-out-left {
        animation: slide-out-to-left 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }
    .animate-in-left {
        animation: slide-in-from-left 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-out-right {
        animation: slide-out-to-right 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .scroll-mask {
      -webkit-mask-image: linear-gradient(to bottom, black, black calc(100% - 40px), transparent);
      mask-image: linear-gradient(to bottom, black, black calc(100% - 40px), transparent);
    }
    .indicator-pill {
      transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55), width 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "rxjs": "https://aistudiocdn.com/rxjs@^7.8.2?conditions=es2015",
    "rxjs/operators": "https://aistudiocdn.com/rxjs@^7.8.2/operators?conditions=es2015",
    "rxjs/ajax": "https://aistudiocdn.com/rxjs@^7.8.2/ajax?conditions=es2015",
    "rxjs/webSocket": "https://aistudiocdn.com/rxjs@^7.8.2/webSocket?conditions=es2015",
    "rxjs/testing": "https://aistudiocdn.com/rxjs@^7.8.2/testing?conditions=es2015",
    "rxjs/fetch": "https://aistudiocdn.com/rxjs@^7.8.2/fetch?conditions=es2015",
    "@angular/compiler": "https://next.esm.sh/@angular/compiler@^20.3.12?external=rxjs",
    "@angular/platform-browser": "https://next.esm.sh/@angular/platform-browser@^20.3.12?external=rxjs",
    "@angular/core": "https://next.esm.sh/@angular/core@^20.3.12?external=rxjs",
    "@angular/common": "https://next.esm.sh/@angular/common@^20.3.12?external=rxjs"
  }
}
</script>
</head>
<body class="text-white overflow-hidden">
  <app-root></app-root>
</body>
</html>
