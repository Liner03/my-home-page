@if (aboutData(); as data) {
  <div class="glass-card w-full h-full rounded-2xl p-8 flex flex-col sm:flex-row items-center justify-center gap-8 overflow-y-auto hide-scrollbar">
    <div class="flex-shrink-0">
      <img [src]="data.avatarUrl" alt="Creator Avatar" class="w-48 h-48 rounded-full border-2 border-white/20 shadow-lg">
    </div>
    <div class="flex flex-col gap-4 text-center sm:text-left">
      <h2 class="text-4xl font-bold text-glow">{{ data.name }}</h2>
      <p class="text-xl text-indigo-300 font-medium">{{ data.title }}</p>

      <!-- GitHub Contribution Calendar -->
      <div class="w-full max-w-2xl">
        <img
          [src]="'https://gh-calendar.rschristian.dev/user/' + data.githubUsername"
          [alt]="'GitHub contributions for ' + data.githubUsername"
          class="w-full rounded-lg border border-white/10 bg-white/5 p-2"
          loading="lazy">
      </div>

      <div class="flex flex-wrap gap-2 justify-center sm:justify-start">
        @for (tag of data.skills; track tag) {
          <span class="px-3 py-1 bg-white/10 border border-white/20 rounded-full text-sm font-medium text-gray-200 transition-all duration-300 hover:bg-white/20 hover:scale-105 hover:shadow-lg hover:shadow-purple-500/20">
            {{ tag }}
          </span>
        }
      </div>
    </div>
  </div>
}
