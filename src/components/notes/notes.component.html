<div class="glass-card w-full h-full rounded-2xl p-8 flex flex-col overflow-hidden">
  <!-- Header with RSS Subscribe -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-3xl font-bold text-glow">Notes & Articles</h2>
    <button (click)="downloadRSS()" class="flex items-center gap-2 px-4 py-2 glass-card rounded-lg hover:bg-white/10 transition-all group">
      <svg class="w-5 h-5 text-orange-400 group-hover:text-orange-300" fill="currentColor" viewBox="0 0 24 24">
        <path d="M6.503 20.752c0 1.794-1.456 3.248-3.251 3.248-1.796 0-3.252-1.454-3.252-3.248 0-1.794 1.456-3.248 3.252-3.248 1.795.001 3.251 1.454 3.251 3.248zm-6.503-12.572v4.811c6.05.062 10.96 4.966 11.022 11.009h4.817c-.062-8.71-7.118-15.758-15.839-15.82zm0-3.368c10.58.046 19.152 8.594 19.183 19.188h4.817c-.03-13.231-10.755-23.954-24-24v4.812z"/>
      </svg>
      <span class="text-sm">RSS</span>
    </button>
  </div>

  <!-- Category Filters -->
  <div class="flex-shrink-0 flex flex-wrap gap-2 mb-6">
    @for (category of categories(); track category.id) {
      <button
        (click)="setCategory(category.id)"
        class="px-4 py-2 text-sm rounded-full transition-all"
        [class.bg-purple-500]="activeCategory() === category.id && category.id === 'inspiration'"
        [class.bg-sky-500]="activeCategory() === category.id && category.id === 'todo'"
        [class.bg-yellow-500]="activeCategory() === category.id && category.id === 'learning'"
        [class.bg-blue-500]="activeCategory() === category.id && category.id === 'project'"
        [class.bg-red-500]="activeCategory() === category.id && category.id === 'secure'"
        [class.bg-white/10]="activeCategory() !== category.id"
        [class.hover:bg-white/15]="activeCategory() !== category.id">
        {{ category.label }}
      </button>
    }
  </div>

  <!-- Notes List -->
  <div class="flex-grow overflow-y-auto hide-scrollbar scroll-mask">
    <div class="space-y-4">
      @for (note of filteredNotes(); track note.id) {
        <div class="glass-card border border-white/10 rounded-xl p-6 transition-all duration-300 hover:border-indigo-400/50 hover:shadow-lg hover:shadow-indigo-500/10" [class.blur-sm]="note.category === 'secure'">
          <h3 class="text-xl font-bold text-indigo-300 mb-2">{{ note.title }}</h3>
          <p class="text-gray-300 mb-3 text-sm leading-relaxed">{{ note.description }}</p>
          @if (note.url) {
            <a [href]="note.url" target="_blank" class="inline-flex items-center text-indigo-400 hover:text-indigo-300 text-sm mb-3 transition-colors">
              <span>Read more</span>
              <svg class="w-4 h-4 ml-1" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
              </svg>
            </a>
          }
          <div class="flex items-center justify-between text-xs text-gray-500 mt-3 pt-3 border-t border-white/5">
            <span class="px-2 py-1 bg-white/10 rounded">{{ note.category }}</span>
            <span>{{ note.timestamp }}</span>
          </div>
        </div>
      } @empty {
        <div class="text-center text-gray-500 py-12">
          <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
          </svg>
          <p>No entries in this category.</p>
        </div>
      }
    </div>
  </div>
</div>
